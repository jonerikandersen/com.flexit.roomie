<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Single Roomie fan: square housing (matches product look) with 6-blade impeller -->
  <rect x="36" y="36" width="184" height="184" rx="28" fill="#1e5aa0"/>
  <g transform="translate(128 128)" fill="#ffffff">
    <!-- Outer ring -->
    <circle r="78" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.35"/>
    <!-- 6 curved blades, rotated -->
    <g>
      <path d="M0 -70 C 22 -52 22 -22 0 -8 C -22 -22 -22 -52 0 -70 Z"/>
      <path d="M0 -70 C 22 -52 22 -22 0 -8 C -22 -22 -22 -52 0 -70 Z" transform="rotate(60)"/>
      <path d="M0 -70 C 22 -52 22 -22 0 -8 C -22 -22 -22 -52 0 -70 Z" transform="rotate(120)"/>
      <path d="M0 -70 C 22 -52 22 -22 0 -8 C -22 -22 -22 -52 0 -70 Z" transform="rotate(180)"/>
      <path d="M0 -70 C 22 -52 22 -22 0 -8 C -22 -22 -22 -52 0 -70 Z" transform="rotate(240)"/>
      <path d="M0 -70 C 22 -52 22 -22 0 -8 C -22 -22 -22 -52 0 -70 Z" transform="rotate(300)"/>
    </g>
    <!-- Hub -->
    <circle r="14" fill="#1e5aa0"/>
    <circle r="7"/>
  </g>
</svg>
