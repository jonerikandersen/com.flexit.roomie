<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- App icon: stylized house silhouette with airflow loop = ventilation -->
  <circle cx="128" cy="128" r="124" fill="#1e5aa0"/>

  <!-- House outline -->
  <g fill="#ffffff" opacity="0.18">
    <path d="M 64 132 L 128 76 L 192 132 L 192 192 L 64 192 Z"/>
  </g>

  <!-- Roof line -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
    <path d="M 58 134 L 128 70 L 198 134"/>
    <path d="M 70 130 L 70 196 L 186 196 L 186 130" stroke-linecap="round"/>
  </g>

  <!-- Central fan/impeller (heart of the system) -->
  <g transform="translate(128 148)">
    <circle r="36" fill="#ffffff" opacity="0.25"/>
    <g fill="#ffffff">
      <path d="M0 -30 C 9 -22 9 -10 0 -4 C -9 -10 -9 -22 0 -30 Z"/>
      <path d="M0 -30 C 9 -22 9 -10 0 -4 C -9 -10 -9 -22 0 -30 Z" transform="rotate(60)"/>
      <path d="M0 -30 C 9 -22 9 -10 0 -4 C -9 -10 -9 -22 0 -30 Z" transform="rotate(120)"/>
      <path d="M0 -30 C 9 -22 9 -10 0 -4 C -9 -10 -9 -22 0 -30 Z" transform="rotate(180)"/>
      <path d="M0 -30 C 9 -22 9 -10 0 -4 C -9 -10 -9 -22 0 -30 Z" transform="rotate(240)"/>
      <path d="M0 -30 C 9 -22 9 -10 0 -4 C -9 -10 -9 -22 0 -30 Z" transform="rotate(300)"/>
    </g>
    <circle r="6" fill="#1e5aa0"/>
  </g>
</svg>
